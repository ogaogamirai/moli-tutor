<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moli-Tutor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    #root { display: flex; height: 100%; width: 100%; }
    #left, #right { flex: 1 1 50%; min-width: 0; height: 100%; }
    #left { position: relative; border-right: 1px solid #334155; background: #fff; }
    #material { width: 100%; height: 100%; border: 0; }
    #material-error {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #fca5a5;
      text-align: center;
      padding: 24px;
      font-size: 0.95rem;
      line-height: 1.7;
      white-space: pre-line;
      z-index: 900;
    }
    #material-error.show { display: flex; }
    #right {
      display: flex;
      flex-direction: column;
      padding: 16px 20px;
      gap: 12px;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }
    #root.layout-left-only #left { flex: 1 1 100%; width: 100%; border-right: none; }
    #root.layout-left-only #right { display: none !important; }
    #root.layout-right-only #left { display: none !important; }
    #root.layout-right-only #right { flex: 1 1 100%; width: 100%; }

    .layout-toggle-bar {
      display: inline-flex;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
      margin-left: auto;
    }
    .layout-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .layout-btn:hover {
      background: #334155;
      color: #f8fafc;
    }
    .layout-btn.active {
      background: #3b82f6;
      color: #ffffff;
      font-weight: 600;
    }
    #left-float-bar {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 1000;
      display: none;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 3px 6px;
    }
    #root.layout-left-only #left-float-bar {
      display: block;
    }

    #dag-map {
      flex: 0 0 auto;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #131c2e;
      padding: 8px 10px 10px;
      max-height: 38%;
      overflow: auto;
    }
    #dag-map[hidden] { display: none; }
    .dag-map-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .dag-map-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .dag-progress { margin-left: auto; font-size: 0.72rem; color: #64748b; }
    .dag-list { display: flex; flex-direction: column; gap: 2px; }
    .dag-node {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      color: #cbd5e1;
      border: 1px solid transparent;
    }
    .dag-node:hover { background: #1e293b; }
    .dag-node.active { background: rgba(30, 58, 138, 0.25); border-color: #3b82f6; }
    .dag-node.completed { color: #64748b; }
    .dag-node.completed .dag-node-label { text-decoration: line-through; }
    .dag-node-status { width: 1.1em; text-align: center; }
    .dag-node-label {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dag-node-type {
      font-size: 0.62rem;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 999px;
      padding: 1px 6px;
      white-space: nowrap;
    }

    .board-section-header {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    .d2-actions {
      display: inline-flex;
      gap: 6px;
      margin-left: auto;
    }
    .d2-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .d2-btn:hover {
      background: #3b82f6;
      color: #ffffff;
      border-color: #3b82f6;
    }
    .board-section--d2 { min-height: 12rem; }
    .board-section--d2 .board-section-body svg {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    #right-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 0 0 auto;
    }
    #right-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
    }
    #board-stack {
      display: block;
      width: 100%;
      padding: 2px 0 24px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #131c2e;
    }
    .board-section {
      display: block;
      padding: 20px 22px;
      background: transparent;
      border: none;
      border-top: 1px solid #334155;
      overflow: visible;
      max-height: none;
      scroll-margin: 28px;
      transition: opacity 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .board-section:first-child { border-top: none; }
    .board-section--math { min-height: 8rem; }
    .board-section--svg { min-height: 10rem; }
    .board-section--mermaid { min-height: 22rem; }
    .board-section--text { min-height: 9rem; }
    .board-section--iframe { min-height: 22rem; }
    .board-iframe {
      width: 100%;
      min-height: 20rem;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
    }
    .board-section--focused {
      background: rgba(30, 58, 138, 0.22);
      box-shadow: inset 0 0 0 2px #3b82f6;
    }
    .board-section--dimmed { opacity: 0.42; }
    .board-section-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .board-section-body { font-size: 1rem; overflow: visible; }
    .board-section-body svg { max-width: 100%; height: auto; display: block; }
    .board-section-body .mermaid,
    .board-section-body svg[id^="moli-mmd"] { max-width: 100%; }
    .board-section--math .board-section-body { font-size: 1.2rem; }
    .board-section--text .board-section-body { line-height: 1.55; color: #e2e8f0; white-space: pre-wrap; }
    #status { flex: 0 0 auto; font-size: 0.75rem; color: #64748b; }
    #tutor-prompt {
      flex: 0 0 auto;
      font-size: 0.9rem;
      line-height: 1.45;
      padding: 10px 12px;
      background: #172554;
      border: 1px solid #1e40af;
      border-radius: 8px;
      color: #dbeafe;
      white-space: pre-wrap;
    }
    #tutor-prompt:empty { display: none; }
  </style>
</head>
<body>
  <div id="root">
    <div id="left">
      <div id="left-float-bar">
        <button class="layout-btn" onclick="setLayout('split')">解説を開く ⮞</button>
      </div>
      <iframe id="material" title="教材ビューア"></iframe>
      <div id="material-error"></div>
    </div>
    <div id="right">
      <div id="right-head">
        <h2>解説ボード <span class="shell-build" id="shell-build">b13</span></h2>
        <div class="layout-toggle-bar">
          <button class="layout-btn" id="btn-layout-left" onclick="setLayout('left-only')" title="教材のみ全幅 (Alt+1)">◀ 教材のみ</button>
          <button class="layout-btn active" id="btn-layout-split" onclick="setLayout('split')" title="2分割表示 (Alt+2)">50:50</button>
          <button class="layout-btn" id="btn-layout-right" onclick="setLayout('right-only')" title="解説のみ全幅 (Alt+3)">解説のみ ▶</button>
        </div>
      </div>
      <section id="dag-map" hidden>
        <div class="dag-map-head">
          <span class="dag-map-title">🗺️ 学習マップ</span>
          <span class="dag-progress" id="dag-progress"></span>
        </div>
        <div class="dag-list" id="dag-list"></div>
      </section>
      <div id="tutor-prompt"></div>
      <div id="right-scroll">
        <div id="board-stack" class="board-document" aria-label="解説ボード（一体表示・フォーカスで誘導）"></div>
      </div>
      <div id="status">tutor_state.json を監視中…</div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
  <script>
    let lastActionId = null;
    let pendingMaterialUrl = null;
    let queuedAction = null;
    let retryTimer = null;

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || data.source !== "moli-tutor-material") return;
      if (data.result && data.result.success && data.actionId != null) {
        lastActionId = data.actionId;
        if (queuedAction && queuedAction.id === data.actionId) queuedAction = null;
        if (retryTimer) {
          clearInterval(retryTimer);
          retryTimer = null;
        }
      }
    });

    function getMaterialFrame() {
      return document.getElementById("material");
    }

    let bridgeInlinePromise = null;

    function injectMaterialBridge(frame) {
      try {
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        if (!doc || !win) return Promise.resolve(false);
        if (win.moliTutor) return Promise.resolve(true);
        if (!bridgeInlinePromise) {
          bridgeInlinePromise = fetch(new URL("material_bridge.js?v=3", window.location.href).href)
            .then((r) => r.text())
            .then((code) => {
              const s = doc.createElement("script");
              s.id = "moli-tutor-bridge-loaded";
              s.textContent = code;
              (doc.head || doc.documentElement).appendChild(s);
              return true;
            })
            .catch(() => false);
        }
        return bridgeInlinePromise;
      } catch (_) {
        return Promise.resolve(false);
      }
    }

    function runOnMaterial(action, payload) {
      const frame = getMaterialFrame();
      if (!frame || !frame.contentWindow) return false;
      const win = frame.contentWindow;
      const api = win.moliTutor;
      if (!api) return false;
      let result = { success: false };
      const type = action.type || "scroll_to";
      if (type === "scroll_to" && (action.target_text || action.heading_index != null)) {
        result = api.highlightAndScroll(action.target_text, {
          match: action.match,
          occurrence: action.occurrence,
          behavior: action.behavior,
          heading_index: action.heading_index
        });
      } else if (type === "scroll_viewport") {
        result = api.scrollViewport(action);
      } else if (type === "scroll_hash" && action.hash) {
        result = api.scrollToHash(action.hash, action);
      }
      if (result && result.success && action.id != null) {
        lastActionId = action.id;
        if (queuedAction && queuedAction.id === action.id) queuedAction = null;
        if (retryTimer) {
          clearInterval(retryTimer);
          retryTimer = null;
        }
      }
      return result && result.success;
    }

    function postToMaterial(message) {
      const frame = getMaterialFrame();
      if (!frame || !frame.contentWindow) return;
      frame.contentWindow.postMessage({ source: "moli-tutor-shell", ...message }, "*");
    }

    function dispatchMaterialAction(action) {
      if (runOnMaterial(action, actionToPayload(action))) return;
      postToMaterial(actionToPayload(action));
    }

    function onMaterialFrameReady() {
      const frame = getMaterialFrame();
      if (!frame) return;
      injectMaterialBridge(frame);
      if (queuedAction) startActionRetries(queuedAction);
    }

    function checkMaterialError(frame) {
      const box = document.getElementById("material-error");
      if (!box || !frame) return;
      let bad = false;
      try {
        const doc = frame.contentDocument;
        if (!doc) return;
        const title = doc.title || "";
        const body = doc.body ? (doc.body.textContent || "").slice(0, 300) : "";
        bad = /Error response/i.test(title) || /Error code:\s*404/.test(body);
      } catch (_) {
        return;
      }
      if (bad) {
        box.textContent =
          "⚠️ 教材が見つかりません\n\n左ペインのURLが配信対象にありません。\n起動時の --material-dir と tutor_state.json の url を一致させてください。\n\n" +
          (frame.getAttribute("src") || "");
        box.classList.add("show");
      } else {
        box.classList.remove("show");
      }
    }

    function setMaterialUrl(url) {
      const frame = getMaterialFrame();
      if (!url || !frame) return;
      pendingMaterialUrl = url;
      const cur = frame.getAttribute("src");
      if (cur !== url) {
        frame.onload = function () {
          bridgeInlinePromise = null;
          onMaterialFrameReady();
          checkMaterialError(frame);
        };
        frame.setAttribute("src", url);
      } else if (frame.contentDocument && frame.contentDocument.readyState === "complete") {
        onMaterialFrameReady();
        checkMaterialError(frame);
      }
    }

    function scrollRightPane(opts) {
      const el = getBoardScrollContainer();
      if (!el) return false;
      const behavior = (opts && opts.behavior) || "smooth";
      const max = Math.max(0, el.scrollHeight - el.clientHeight);
      let top = el.scrollTop;
      if (opts && opts.y_ratio != null) {
        top = max * Math.max(0, Math.min(1, Number(opts.y_ratio)));
      } else if (opts && opts.y_px != null) {
        top = Math.max(0, Math.min(max, Number(opts.y_px)));
      } else if (opts && opts.dy != null) {
        top = Math.max(0, Math.min(max, el.scrollTop + Number(opts.dy)));
      } else {
        return false;
      }
      el.scrollTo({ top, behavior });
      return true;
    }

    function actionToPayload(action) {
      const type = action.type || "scroll_to";
      return {
        type,
        actionId: action.id,
        pane: action.pane,
        target_text: action.target_text,
        hash: action.hash,
        heading_index: action.heading_index,
        match: action.match,
        occurrence: action.occurrence,
        y_ratio: action.y_ratio,
        y_px: action.y_px,
        dy: action.dy,
        behavior: action.behavior,
        section_id: action.section_id,
        section_index: action.section_index,
        dim: action.dim
      };
    }

    function startActionRetries(action) {
      if (!action || action.id == null) return;
      if (retryTimer) clearInterval(retryTimer);
      const payload = actionToPayload(action);
      let n = 0;
      retryTimer = setInterval(() => {
        if (lastActionId === action.id) {
          clearInterval(retryTimer);
          retryTimer = null;
          return;
        }
        injectMaterialBridge(getMaterialFrame()).then(() => dispatchMaterialAction(action));
        n += 1;
        if (n >= 24) {
          clearInterval(retryTimer);
          retryTimer = null;
        }
      }, 350);
      injectMaterialBridge(getMaterialFrame()).then(() => dispatchMaterialAction(action));
    }

    function runActionRequest(action) {
      if (!action || action.id == null) return;
      if (lastActionId === action.id) return;
      const type = action.type || "scroll_to";
      const pane = action.pane || "material";
      if (type === "focus_board") {
        setLayout("split");
        focusBoardWithRetry(action);
        return;
      }
      if (type === "scroll_viewport" && pane === "right") {
        setLayout("split");
        if (scrollRightPane(action)) lastActionId = action.id;
        return;
      }
      if (type === "navigate_to" && action.url) {
        queuedAction = action.then_scroll_to
          ? { id: action.id, type: "scroll_to", target_text: action.then_scroll_to }
          : null;
        setMaterialUrl(action.url);
        if (!action.then_scroll_to) lastActionId = action.id;
        return;
      }
      if (
        (type === "scroll_to" && (action.target_text || action.heading_index != null)) ||
        (type === "scroll_hash" && action.hash) ||
        (type === "scroll_viewport" && pane !== "right")
      ) {
        queuedAction = action;
        const frame = getMaterialFrame();
        if (frame && frame.getAttribute("src")) {
          startActionRetries(action);
        }
        return;
      }
    }

    function setLatestMessage(msg) {
      const el = document.getElementById("tutor-prompt");
      if (!el) return;
      if (!msg) {
        el.textContent = "";
        return;
      }
      el.textContent = typeof msg === "string" ? msg : (msg.text || "");
    }
    let lastSectionsKey = null;
    let mermaidInit = false;
    let mermaidSerial = 0;
    function ensureMermaid() {
      if (mermaidInit || typeof mermaid === "undefined") return Promise.resolve(!!mermaidInit);
      mermaid.initialize({
        startOnLoad: false,
        theme: "dark",
        securityLevel: "loose",
        fontFamily: '"Segoe UI", system-ui, sans-serif'
      });
      mermaidInit = true;
      return Promise.resolve(true);
    }

    function renderMathInto(el, tex) {
      el.replaceChildren();
      if (!tex) return;
      if (window.katex) {
        try {
          katex.render(tex, el, { throwOnError: false, displayMode: true });
          return;
        } catch (_) {
          el.textContent = tex;
          return;
        }
      }
      el.textContent = tex;
    }

    function renderMermaidInto(el, source) {
      el.replaceChildren();
      if (!source || !String(source).trim()) return;
      const code = String(source).trim();
      ensureMermaid().then(() => {
        if (typeof mermaid === "undefined") {
          el.textContent = code;
          return;
        }
        mermaidSerial += 1;
        const uid = "moli-mmd-" + mermaidSerial + "-" + Date.now();
        mermaid
          .render(uid, code)
          .then(({ svg }) => {
            el.innerHTML = svg;
          })
          .catch(() => {
            el.textContent = code;
          });
      });
    }

    function sectionsFromState(state) {
      if (Array.isArray(state.sections) && state.sections.length) return state.sections;
      const legacy = [];
      if (state.svg) legacy.push({ type: "svg", title: "図", content: state.svg });
      if (state.math) legacy.push({ type: "math", title: "式", content: state.math });
      if (state.mermaid) legacy.push({ type: "mermaid", title: "関係図", content: state.mermaid });
      return legacy;
    }

    function boardSectionEl(sectionRef) {
      const stack = document.getElementById("board-stack");
      if (!stack || sectionRef == null) return null;
      const raw = String(sectionRef);
      if (/^\d+$/.test(raw)) {
        const idx = Number(raw);
        return stack.children[idx] || null;
      }
      return stack.querySelector('[data-board-id="' + raw + '"]');
    }

    function getBoardScrollContainer() {
      return document.getElementById("right-scroll") || document.getElementById("right");
    }

    function applyBoardFocus(sectionRef, opts) {
      const stack = document.getElementById("board-stack");
      if (!stack || sectionRef == null) return false;
      const el = boardSectionEl(sectionRef);
      const dim = !(opts && opts.dim === false);
      stack.querySelectorAll(".board-section").forEach((node) => {
        node.classList.remove("board-section--focused");
        node.classList.toggle("board-section--dimmed", dim);
      });
      if (!el) return false;
      el.classList.add("board-section--focused");
      el.classList.remove("board-section--dimmed");
      const behavior = (opts && opts.behavior) || "smooth";
      const scroller = getBoardScrollContainer();
      if (scroller && scroller !== document.body) {
        const pad = 16;
        const er = el.getBoundingClientRect();
        const sr = scroller.getBoundingClientRect();
        const target =
          scroller.scrollTop +
          (er.top - sr.top) -
          Math.max(0, (sr.height - er.height) / 2);
        scroller.scrollTo({ top: Math.max(0, target - pad), behavior });
      } else {
        el.scrollIntoView({ behavior, block: "center" });
      }
      return true;
    }

    function focusBoardWithRetry(action) {
      if (!action || action.id == null) return;
      const ref =
        action.section_id != null
          ? action.section_id
          : action.section_index != null
            ? action.section_index
            : null;
      if (ref == null) return;
      let n = 0;
      const tick = () => {
        if (lastActionId === action.id) return;
        if (applyBoardFocus(ref, action)) {
          lastActionId = action.id;
          return;
        }
        n += 1;
        if (n < 24) setTimeout(tick, 200);
      };
      tick();
    }

    function setLayout(mode) {
      const root = document.getElementById("root");
      if (!root) return;
      root.classList.remove("layout-left-only", "layout-right-only");
      document.querySelectorAll(".layout-btn").forEach((b) => b.classList.remove("active"));
      if (mode === "left-only") {
        root.classList.add("layout-left-only");
        const b = document.getElementById("btn-layout-left");
        if (b) b.classList.add("active");
      } else if (mode === "right-only") {
        root.classList.add("layout-right-only");
        const b = document.getElementById("btn-layout-right");
        if (b) b.classList.add("active");
      } else {
        const b = document.getElementById("btn-layout-split");
        if (b) b.classList.add("active");
      }
      try { localStorage.setItem("moli_layout_mode", mode); } catch (_) {}
    }

    window.addEventListener("keydown", (e) => {
      if (e.altKey && !e.ctrlKey && !e.metaKey) {
        if (e.key === "1") { setLayout("left-only"); e.preventDefault(); }
        else if (e.key === "2") { setLayout("split"); e.preventDefault(); }
        else if (e.key === "3") { setLayout("right-only"); e.preventDefault(); }
      }
    });

    try {
      const savedLayout = localStorage.getItem("moli_layout_mode");
      setLayout(savedLayout || "left-only");
    } catch (_) {}

    let lastDagKey = null;

    function renderDagMap(dag) {
      const wrap = document.getElementById("dag-map");
      const list = document.getElementById("dag-list");
      if (!wrap || !list) return;
      const nodes = Array.isArray(dag) ? dag : [];
      const key = JSON.stringify(nodes);
      if (key === lastDagKey) return;
      lastDagKey = key;
      if (!nodes.length) {
        wrap.hidden = true;
        list.replaceChildren();
        return;
      }
      wrap.hidden = false;
      list.replaceChildren();
      let done = 0;
      nodes.forEach((node, idx) => {
        const status = node.status || "pending";
        if (status === "completed") done += 1;
        const item = document.createElement("div");
        item.className = "dag-node " + status;
        const statusEl = document.createElement("span");
        statusEl.className = "dag-node-status";
        statusEl.textContent = status === "completed" ? "✅" : status === "active" ? "🎯" : "⚪";
        const label = document.createElement("span");
        label.className = "dag-node-label";
        label.textContent = node.name || node.id || "node " + idx;
        label.title = node.name || "";
        const typeEl = document.createElement("span");
        typeEl.className = "dag-node-type";
        typeEl.textContent = node.type === "prerequisite" ? "前提" : "概念";
        item.append(statusEl, label, typeEl);
        item.addEventListener("click", () => jumpToDagNode(node));
        list.appendChild(item);
      });
      const prog = document.getElementById("dag-progress");
      if (prog) prog.textContent = done + "/" + nodes.length + " 完了";
    }

    function dagNodeToAction(node) {
      if (!node) return null;
      const action = { id: Date.now(), type: "scroll_to", behavior: "smooth" };
      if (node.heading_index != null) {
        action.heading_index = node.heading_index;
        action.match = "heading";
      } else if (node.target_text) {
        action.target_text = node.target_text;
        action.match = node.match || "first";
      } else if (node.heading) {
        action.target_text = node.heading;
        action.match = "heading";
      } else {
        return null;
      }
      return action;
    }

    function jumpToDagNode(node) {
      const action = dagNodeToAction(node);
      if (!action) return;
      queuedAction = action;
      const frame = getMaterialFrame();
      if (frame && frame.getAttribute("src")) startActionRetries(action);
    }

    function renderBoard(state) {
      const stack = document.getElementById("board-stack");
      if (!stack) return;
      const sections = sectionsFromState(state);
      const key = JSON.stringify(sections);
      if (key === lastSectionsKey) return;
      lastSectionsKey = key;
      stack.replaceChildren();
      sections.forEach((sec, idx) => {
        const type = (sec.type || "text").toLowerCase();
        const wrap = document.createElement("section");
        wrap.className = "board-section board-section--" + type;
        const bid = sec.id != null ? String(sec.id) : "sec-" + idx;
        wrap.setAttribute("data-board-id", bid);

        if (sec.title || type === "d2") {
          const header = document.createElement("div");
          header.className = "board-section-header";
          if (sec.title) {
            const title = document.createElement("div");
            title.className = "board-section-title";
            title.textContent = sec.title;
            header.appendChild(title);
          }
          if (type === "d2") {
            const actions = document.createElement("div");
            actions.className = "d2-actions";

            const btnExportSvg = document.createElement("button");
            btnExportSvg.className = "d2-btn";
            btnExportSvg.title = "SVGファイルとしてダウンロード保存";
            btnExportSvg.textContent = "📥 SVG保存";
            btnExportSvg.onclick = (e) => {
              e.stopPropagation();
              const svgData = sec.content;
              const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url;
              a.download = (sec.id || "diagram") + ".svg";
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
            };
            actions.appendChild(btnExportSvg);

            if (sec.d2_source) {
              const btnCopyD2 = document.createElement("button");
              btnCopyD2.className = "d2-btn";
              btnCopyD2.title = "D2ソースコードをクリップボードにコピー";
              btnCopyD2.textContent = "📋 D2コピー";
              btnCopyD2.onclick = (e) => {
                e.stopPropagation();
                navigator.clipboard.writeText(sec.d2_source).then(() => {
                  btnCopyD2.textContent = "✅ コピー完了";
                  setTimeout(() => { btnCopyD2.textContent = "📋 D2コピー"; }, 2000);
                });
              };
              actions.appendChild(btnCopyD2);
            }

            header.appendChild(actions);
          }
          wrap.appendChild(header);
        }

        const body = document.createElement("div");
        body.className = "board-section-body";
        wrap.appendChild(body);
        stack.appendChild(wrap);
        const content = sec.content != null ? sec.content : "";
        if (type === "d2" || type === "svg") body.innerHTML = content;
        else if (type === "math") renderMathInto(body, content);
        else if (type === "mermaid") renderMermaidInto(body, content);
        else if (type === "iframe" || type === "visual_html") {
          const src = String(content).trim();
          const frame = document.createElement("iframe");
          frame.className = "board-iframe";
          frame.setAttribute("title", sec.title || "visual");
          frame.setAttribute("loading", "lazy");
          frame.src = src.startsWith("http") ? src : new URL(src.replace(/^\//, ""), window.location.origin + "/").href;
          body.appendChild(frame);
        } else body.textContent = String(content);
      });
    }

    window.applyState = function (state) {
      if (!state || typeof state !== "object") return;
      const pageUrl = state.page_url || state.url;
      if (pageUrl) setMaterialUrl(pageUrl);
      if (state.board_visible === true) setLayout("split");
      else if (state.board_visible === false) setLayout("left-only");
      renderDagMap(state.dag);
      renderBoard(state);
      if (state.latest_message) setLatestMessage(state.latest_message);
      if (state.board_focus != null && (!state.action_request || state.action_request.type !== "focus_board")) {
        applyBoardFocus(state.board_focus, { dim: state.board_focus_dim !== false, behavior: "auto" });
      }
      if (state.action_request) runActionRequest(state.action_request);
      const st = document.getElementById("status");
      if (st) {
        const dag = state.dag ? " · DAG " + state.dag.length + " nodes" : "";
        st.textContent = "同期: " + new Date().toLocaleTimeString() + dag;
      }
    };

    // ブラウザ直接表示用（pywebview外でも状態変更を自動反映）
    let lastBrowserStateJson = "";
    setInterval(async () => {
      try {
        const res = await fetch("/api/state?t=" + Date.now());
        if (res.ok) {
          const text = await res.text();
          if (text !== lastBrowserStateJson) {
            lastBrowserStateJson = text;
            const state = JSON.parse(text);
            window.applyState(state);
          }
        }
      } catch (_) {}
    }, 400);
  </script>
</body>
</html>
